name: Update engineering lab section

on:
  push:
    paths:
      - "data/lab.json"
      - "scripts/update_lab.py"
      - ".github/workflows/update-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update README
        run: python scripts/update_lab.py
      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update engineering lab"
            git push
          fi
