<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Yashika Agrawal developer terminal</title>
<desc id="desc">A dark terminal introducing Yashika Agrawal, software engineer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101923"/><stop offset="1" stop-color="#11101d"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7ee787"/><stop offset="1" stop-color="#7dd3fc"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="1098" height="358" rx="18" fill="url(#bg)" stroke="#303b4a" stroke-width="2"/>
<path d="M1 58H1099" stroke="#303b4a"/>
<circle cx="30" cy="29" r="7" fill="#ff6b6b"/><circle cx="55" cy="29" r="7" fill="#ffd166"/><circle cx="80" cy="29" r="7" fill="#7ee787"/>
<text x="550" y="35" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="15">yashika@engineering-lab ~ zsh</text>
<text x="48" y="111" fill="#7ee787" font-family="monospace" font-size="19">$ whoami</text>
<text x="48" y="151" fill="#f8fafc" font-family="monospace" font-size="34" font-weight="700">Yashika Agrawal</text>
<text x="48" y="183" fill="#9fb0c3" font-family="monospace" font-size="18">Software Engineer · Full Stack Development</text>
<text x="48" y="235" fill="#7ee787" font-family="monospace" font-size="18">$ focus --current</text>
<text x="48" y="267" fill="#d8e2ef" font-family="monospace" font-size="17">Backend Engineering (.NET &amp; Node)  /  Cloud &amp; DevOps</text>
<text x="48" y="311" fill="#7ee787" font-family="monospace" font-size="18">$ status</text>
<text x="151" y="311" fill="url(#glow)" font-family="monospace" font-size="18">building, breaking &amp; learning</text>
<rect x="456" y="328" width="10" height="20" fill="#7ee787" opacity=".9">
  <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
<text x="1050" y="330" text-anchor="end" fill="#526274" font-family="monospace" font-size="12">ENGINEERING LAB / 001</text>
</svg>